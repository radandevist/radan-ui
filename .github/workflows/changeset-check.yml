name: Changeset
on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
jobs:
  changeset:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changeset') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: |
          base=${{ github.event.pull_request.base.sha }}
          # The automated "Version packages" PR (changesets/action) consumes changesets and adds none.
          case "$HEAD_REF" in changeset-release/*) exit 0 ;; esac
          if git diff --name-only $base HEAD | grep -qE '^packages/radan-ui/(src/|lint/|scripts/|package\.json$)'; then
            git diff --name-only --diff-filter=A $base HEAD | grep -qE '^\.changeset/.+\.md$' \
              || { echo "This PR changes the package: add a changeset (npx changeset)."; exit 1; }
          fi
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
